[package]
name = "chromvoid-android-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Android platform logic shared by the Tauri shell and the native client"

[features]
default = []
# Real-vault fixtures for this crate's tests and the shell's. Guarded so a
# release build cannot pull them in.
test-support = ["chromvoid-client-runtime/test-support", "dep:tempfile"]

[dependencies]
chromvoid-core = { path = "../core" }
chromvoid-client-runtime = { path = "../client-runtime" }
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize.workspace = true
tokio = { version = "1", features = ["sync"] }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
chromvoid-client-runtime = { path = "../client-runtime", features = ["test-support"] }
tempfile.workspace = true
