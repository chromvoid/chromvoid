[package]
name = "chromvoid-core"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Core library for ChromVoid encrypted storage"

[features]
default = []
ts-bindings = ["dep:ts-rs"]
mobile-schema = ["dep:schemars"]

[dependencies]
# Crypto
chacha20poly1305.workspace = true
argon2.workspace = true
blake3.workspace = true
sha2.workspace = true
sha1.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
getrandom.workspace = true
zeroize.workspace = true
subtle.workspace = true
bip39.workspace = true
bitcoin.workspace = true

# Serialization
csv = "1.4.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
linkify = "0.11.0"
serde.workspace = true
serde_json.workspace = true
serde_repr.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
ton = { version = "0.2.5", default-features = false }
p256.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
rsa = "0.9"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "p384", "std", "rand_core", "encryption"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
icu_properties = "2.2.0"
unicode-normalization = "0.1"
tar.workspace = true
tempfile.workspace = true
regex = "1"
url = "2"
percent-encoding = "2.3.2"
psl = { version = "2.1.218", default-features = false, features = ["helpers"] }
tracing = "0.1"

# OTP
totp-rs.workspace = true

# Schema export for native bindings (build tooling only)
schemars = { version = "=1.2.1", optional = true }

# TypeScript bindings (optional)
ts-rs = { workspace = true, optional = true }

# Error handling
thiserror.workspace = true

# Credential archive decoding and icon normalization
keepass = { version = "=0.13.25", path = "../../vendor/keepass-0.13.25", features = ["bounded-import"] }
rawzip = "0.5.1"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }

[dev-dependencies]
criterion = "0.8.2"
tempfile.workspace = true

[[bench]]
name = "core_performance"
harness = false

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
