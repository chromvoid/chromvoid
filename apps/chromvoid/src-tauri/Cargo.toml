[package]
name = "chromvoid"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
build = "build.rs"
default-run = "chromvoid"

[package.metadata.cargo-apple.ios]
no-default-features = true
features = ["ios"]

[lib]
name = "chromvoid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mobile-usb-smoke"
path = "src/bin/mobile-usb-smoke.rs"
required-features = ["mobile-usb-smoke"]

[[bin]]
name = "env-runtime-test-probe"
path = "tests/fixtures/env-runtime-test-probe.rs"
required-features = ["env-runtime-test-probe"]
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[features]
default = ["desktop"]
mobile-usb-smoke = ["desktop"]
desktop = [
    "chromvoid-client-runtime/desktop",
    "dep:webrtc",
    "dep:dav-server",
    "dep:hyper",
    "dep:http-body-util",
    "dep:hyper-util",
    "tokio/rt-multi-thread",
    "tokio/signal",
    "tauri/tray-icon",
]
mobile = [
    "tokio/rt",
]
ios = ["mobile"]
caldav = ["desktop", "dav-server/caldav"]
carddav = ["desktop", "dav-server/carddav"]
# Test-only executable and in-crate harness for the production Env Runtime
# coordinator. The crate root rejects this feature in non-debug builds.
env-runtime-test-probe = ["desktop"]

[dependencies]
chromvoid-network-runtime = { path = "../../../crates/network-runtime" }
chromvoid-client-runtime = { path = "../../../crates/client-runtime" }
chromvoid-android-runtime = { path = "../../../crates/android-runtime" }
tauri = { version = "2.12.4", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
snow = "0.10"
sha2 = "0.10"
hmac = "0.12"
signature = "2"
rsa = "0.9"
rand = "0.8"
base64 = "0.22"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-clipboard-manager = "2.5.0"
webrtc = { version = "0.14", optional = true }
bytes = "1"
async-trait = "0.1"
url = "2"
quinn = { version = "0.11", default-features = true }
uuid = { version = "1", features = ["v4", "serde"] }
rustls-pemfile = "2"
rustls = "0.23"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6"
quick-xml = "0.39"
hex = "0.4"
zxcvbn = "3.1.0"

# ADR-023: WebDAV backend (localhost-only)
dav-server = { version = "0.10", optional = true }
hyper = { version = "1", features = ["http1", "server", "client"], optional = true }
http-body-util = { version = "0.1", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "p384", "std", "rand_core"] }
zeroize = "1"
chromvoid-core = { path = "../../../crates/core" }
chromvoid-media-runtime = { path = "../../../crates/media-runtime" }
chromvoid-protocol = { path = "../../../crates/protocol", features = ["async-transport"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { path = "../../../crates/fuser" }
libc = "0.2"
dbus = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
fuser = { path = "../../../crates/fuser" }
libc = "0.2"
rusb = { version = "0.9", features = ["vendored"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
rusb = "0.9"
ssh2 = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
block2 = "0.6"
dispatch2 = "0.3.1"
objc2 = "0.6"
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDictionary", "NSBundle", "NSObject", "NSProcessInfo", "NSUserDefaults", "NSString", "NSFileManager", "NSURL"] }
objc2-authentication-services = { version = "0.3.2", default-features = false, features = [
    "ASCredentialIdentityStore",
    "ASSettingsHelper",
    "ASCredentialServiceIdentifier",
    "ASPasswordCredentialIdentity",
    "ASOneTimeCodeCredentialIdentity",
    "ASCredentialIdentityStoreState",
    "ASCredentialIdentity",
    "block2",
    "objc2-core-foundation",
    "std",
    "alloc",
] }
objc2-local-authentication = "0.3.2"
security-framework = "3.7"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-background-tasks = "0.3.2"
objc2-ui-kit = { version = "0.3", features = [
    "UIApplication",
    "UIGestureRecognizer",
    "UIScreenEdgePanGestureRecognizer",
    "UIFeedbackGenerator",
    "UIImpactFeedbackGenerator",
    "UIView",
    "UITouch",
    "UIEvent",
    "UIResponder",
] }
tauri-plugin-ios-push-bridge = { path = "../../../crates/tauri-plugin-ios-push-bridge" }
tauri-plugin-ios-native-bridge = { path = "../../../crates/tauri-plugin-ios-native-bridge" }

[dev-dependencies]
lofty = "0.24.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chromvoid-client-runtime = { path = "../../../crates/client-runtime", features = ["test-support"] }
chromvoid-android-runtime = { path = "../../../crates/android-runtime", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
tauri = { version = "2.12.4", features = ["test"] }

[workspace]

[patch.crates-io]
ton = { path = "../../../vendor/ton-0.2.5" }
