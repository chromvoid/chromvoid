name: ChromVoidCredentialProvider
options:
  deploymentTarget:
    macOS: 13.0
configs:
  debug: debug
  release: release
settings:
  base:
    CHROMVOID_APP_VERSION: 0.2.3
    CHROMVOID_APPLE_SOURCE_ROOT: $(PROJECT_DIR)/../../..
    CHROMVOID_TAURI_ROOT: $(PROJECT_DIR)/../../../../..
schemes:
  ChromVoidCredentialProvider:
    build:
      targets:
        ChromVoidProvisioningHost: all
    archive:
      config: release
targets:
  ChromVoidCredentialProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: chromvoid_CredentialProviderExtension/CredentialProviderViewController.swift
      - path: Sources/chromvoid/CredentialIPCBridge.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chromvoid.app.credential-provider
        PRODUCT_NAME: ChromVoidCredentialProvider
        INFOPLIST_FILE: $(CHROMVOID_APPLE_SOURCE_ROOT)/chromvoid_CredentialProviderExtension/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: $(CHROMVOID_APPLE_SOURCE_ROOT)/chromvoid_CredentialProviderExtension/chromvoid_CredentialProviderExtension_macos.entitlements
        MARKETING_VERSION: $(CHROMVOID_APP_VERSION)
        CURRENT_PROJECT_VERSION: $(CHROMVOID_APP_VERSION)
        SWIFT_VERSION: 5.0
        APPLICATION_EXTENSION_API_ONLY: true
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        ENABLE_HARDENED_RUNTIME: true
        REGISTER_APP_GROUPS: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LHWC37D5KT
    dependencies:
      - sdk: AuthenticationServices.framework
      - sdk: Foundation.framework
      - sdk: AppKit.framework

  ChromVoidProvisioningHost:
    type: application
    platform: macOS
    sources:
      - path: chromvoid_macos/ProvisioningHost.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chromvoid.app
        PRODUCT_NAME: ChromVoidProvisioningHost
        INFOPLIST_FILE: $(CHROMVOID_APPLE_SOURCE_ROOT)/chromvoid_macos/ProvisioningHost-Info.plist
        CODE_SIGN_ENTITLEMENTS: $(CHROMVOID_TAURI_ROOT)/Entitlements.plist
        MARKETING_VERSION: $(CHROMVOID_APP_VERSION)
        CURRENT_PROJECT_VERSION: $(CHROMVOID_APP_VERSION)
        ENABLE_HARDENED_RUNTIME: true
        REGISTER_APP_GROUPS: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LHWC37D5KT
    dependencies:
      - target: ChromVoidCredentialProvider
        embed: true
